  island:
    # Enable color output in logs
    tty: true
    # Increase default grace period to ensure clean shutdown
    stop_grace_period: 30s
    build:
      context: ./server
      dockerfile: Dockerfile
    volumes:
      - steam_data:/steam
      - ark_data:/ark
      - ark_backups:/backups

      # Config files
      # If you want to be able to access configs and update them locally, ensure you use this
      # otherwise you can omit this because the ark_data volume will be used for the config files
      # - ./server/config:/ark/ShooterGame/Saved/Config/WindowsServer
      # Note: If you intend to run multiple containers with different maps, you will need to add a config file for each map,
      #       comment out the line above and mount it to the default config name of ark-server-config.json like this:
      - ./server/config/ark-server-config-island.json:/ark/ShooterGame/Saved/Config/WindowsServer/ark-server-config.json
      - ./server/config/Game.ini:/ark/ShooterGame/Saved/Config/WindowsServer/Game.ini
      - ./server/config/GameUserSettings.ini:/ark/ShooterGame/Saved/Config/WindowsServer/GameUserSettings.ini

      # For dev purposes, these files are built into the image
      - ./server/manager:/manager
      - ./server/entrypoint.sh:/entrypoint.sh
    ports:
      - 7777:7777/udp
      - 27015:27015/udp
      - 27020:27020/tcp
    networks:
      - ark
    deploy:
      resources:
        limits:
          memory: 12g

  astraeos:
    # Enable color output in logs
